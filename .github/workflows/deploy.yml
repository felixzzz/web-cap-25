name: Deployment and Code Analysis

on:
  push:
    branches:
      - development
      - release
      - main
  workflow_dispatch:

jobs:
  deploy_dev:
    if: github.ref == 'refs/heads/development'
    name: Deploy to Development
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT }}
          script: |
            echo "${{ secrets.DEV_SUDO_PASSWORD }}" | sudo -S sh -c "cd /web/chandra-asri/ && git fetch --all && git reset --hard origin/development && git pull && docker compose build && docker compose up -d && docker image prune -af"

  deploy_prod:
    if: github.ref == 'refs/heads/main'
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRD_HOST }}
          username: ${{ secrets.PRD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          port: ${{ secrets.PRD_PORT }}
          script: |
            cd ${{ secrets.PRD_PATH }}
            sudo git fetch --all
            BRANCH_NAME="${{ github.ref_name }}"
            sudo git reset --hard origin/$BRANCH_NAME
            sudo git pull
            sudo docker compose build
            sudo docker rm -f ${{ secrets.CONTAINER }} || true
            sudo docker compose up -d
            sudo docker image prune -af
